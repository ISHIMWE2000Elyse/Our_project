<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            border-radius: 16px;
            padding: 40px;
            color: #fff;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
        }

        .login-card h1 {
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 600;
        }

        .login-card p {
            margin-bottom: 30px;
            opacity: 0.85;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        label {
            font-size: 14px;
            opacity: 0.85;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #4facfe;
        }

        button {
            margin-top: 10px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.6);
        }

        .error {
            background: rgba(255, 0, 0, 0.15);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            opacity: 0.8;
        }

        .footer a {
            color: #4facfe;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1>Welcome to production grading app</h1>
    <p>Sign in to continue</p>

    {% if form.errors %}
        <div class="error">
            Invalid username or password
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="id_username">Username</label>
            {{ form.username }}
        </div>

        <div>
            <label for="id_password">Password</label>
            {{ form.password }}
        </div>

        <button type="submit">Sign in</button>
    </form>

    <div class="footer">
        Don’t have an account?
        <a href="#">Create one</a>
    </div>
</div>

</body>
</html>
