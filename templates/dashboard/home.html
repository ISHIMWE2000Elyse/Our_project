{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<h3 class="mb-4">Dashboard</h3>

<div class="row g-3">
    <div class="col-md-3">
        <div class="card text-bg-primary">
            <div class="card-body">
                <h5 class="card-title">Products</h5>
                <p class="card-text">Manage products</p>
                <a href="#" class="btn btn-light btn-sm">View</a>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-success">
            <div class="card-body">
                <h5 class="card-title">Orders</h5>
                <p class="card-text">Production orders</p>
                <a href="#" class="btn btn-light btn-sm">View</a>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-warning">
            <div class="card-body">
                <h5 class="card-title">Grading</h5>
                <p class="card-text">Quality grading</p>
                <a href="#" class="btn btn-light btn-sm">View</a>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-dark">
            <div class="card-body">
                <h5 class="card-title">Reports</h5>
                <p class="card-text">View reports</p>
                <a href="#" class="btn btn-light btn-sm">View</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
