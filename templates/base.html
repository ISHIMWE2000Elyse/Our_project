<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Production Grading{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* ===== GLOBAL ===== */
        body {
            background: radial-gradient(circle at top left, #1e293b, #020617);
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 15px;
            color: #e5e7eb;
        }

        /* ===== LAYOUT ===== */
        .app-wrapper {
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 270px;
            min-height: 100vh;
            background: linear-gradient(
                180deg,
                rgba(255,255,255,0.08),
                rgba(255,255,255,0.02)
            );
            backdrop-filter: blur(18px);
            box-shadow: 6px 0 30px rgba(0,0,0,0.45);
            padding: 28px 22px;
        }

        .sidebar h4 {
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 30px;
        }

        .sidebar .nav-link {
            color: #cbd5f5;
            padding: 12px 16px;
            border-radius: 14px;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .sidebar .nav-link i {
            margin-right: 12px;
            font-size: 1.15rem;
        }

        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.10);
            color: #ffffff;
            transform: translateX(4px);
        }

        .sidebar .nav-link.active {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(99,102,241,0.45);
        }

        .sidebar hr {
            border-color: rgba(255,255,255,0.12);
            margin: 30px 0;
        }

        /* ===== USER BOX ===== */
        .user-box {
            background: rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 18px;
        }

        .user-box .btn {
            border-radius: 999px;
            transition: all 0.25s ease;
        }

        .user-box .btn:hover {
            transform: translateY(-2px);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            padding: 34px;
        }

        /* ===== TOPBAR ===== */
        .topbar {
            background: linear-gradient(
                180deg,
                rgba(255,255,255,0.10),
                rgba(255,255,255,0.04)
            );
            backdrop-filter: blur(14px);
            border-radius: 18px;
            padding: 14px 24px;
            margin-bottom: 30px;
            box-shadow:
                inset 0 1px 1px rgba(255,255,255,0.06),
                0 18px 40px rgba(0,0,0,0.45);
        }

        .topbar strong {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: #ffffff;
        }

        .topbar .text-muted {
            color: #9ca3af !important;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .sidebar {
                position: fixed;
                left: -300px;
                top: 0;
                z-index: 999;
                transition: left 0.3s ease;
            }

            .sidebar.show {
                left: 0;
            }

            .main-content {
                padding: 22px;
            }
        }
    </style>
</head>
<body>

<div class="d-flex app-wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar text-white">

        <h4>
            <i class="bi bi-speedometer2"></i> Production
        </h4>

        <ul class="nav flex-column gap-2">

            <li class="nav-item">
                <a href="{% url 'dashboard_home' %}"
                   class="nav-link {% if request.resolver_match.url_name == 'dashboard_home' %}active{% endif %}">
                    <i class="bi bi-grid-1x2-fill"></i> Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a href="{% url 'available_products' %}"
                   class="nav-link {% if request.resolver_match.url_name == 'available_products' %}active{% endif %}">
                    <i class="bi bi-shop"></i> Shop
                </a>
            </li>

            <li class="nav-item">
                <a href="{% url 'product_list' %}"
                   class="nav-link {% if request.resolver_match.url_name == 'product_list' %}active{% endif %}">
                    <i class="bi bi-box-seam"></i> Products
                </a>
            </li>

            {% if user.is_staff or user.is_superuser %}
            <li class="nav-item">
                <a href="{% url 'reports' %}"
                   class="nav-link {% if request.resolver_match.url_name == 'reports' %}active{% endif %}">
                    <i class="bi bi-bar-chart-line"></i> Reports
                </a>
            </li>
            {% endif %}

        </ul>

        <hr>

        <div class="user-box">
            <div class="fw-semibold">{{ user.username }}</div>
            <div class="small text">{{ user.email }}</div>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-light w-100">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </form>
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div class="topbar d-flex justify-content-between align-items-center">
            <div>
                <strong>{% block page_title %}Dashboard{% endblock %}</strong>
            </div>
            <div class="text-muted small">
                {{ user.username }}
            </div>
        </div>

        {% block content %}{% endblock %}

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
