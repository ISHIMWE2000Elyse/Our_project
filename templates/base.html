<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Production Grading{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-size: 15px;
            font-family: 'Segoe UI', sans-serif;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #212529, #343a40);
            min-height: 100vh;
            box-shadow: 4px 0 12px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        .sidebar h4 {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sidebar .nav-link {
            color: #ced4da;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .sidebar .nav-link i {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        .sidebar .nav-link:hover {
            background-color: rgba(255,255,255,0.1);
            color: #fff;
        }

        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
            font-weight: 500;
        }

        .sidebar hr {
            border-color: rgba(255,255,255,0.15);
        }

        /* USER BOX */
        .user-box {
            font-size: 14px;
        }

        .user-box .btn {
            transition: 0.2s;
        }

        .user-box .btn:hover {
            transform: translateY(-2px);
        }

        /* MAIN CONTENT */
        .main-content {
            padding: 30px;
            width: 100%;
        }

        /* TOPBAR */
        .topbar {
            background: #fff;
            padding: 14px 24px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }

        .topbar strong {
            font-size: 1.1rem;
        }

        /* RESPONSIVE */
        @media (max-width: 992px) {
            .sidebar {
                position: fixed;
                left: -300px;
                top: 0;
                z-index: 999;
                transition: left 0.3s ease;
            }
            .sidebar.show {
                left: 0;
            }
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <aside class="sidebar p-4 text-white">

        <h4 class="mb-4">
            <i class="bi bi-speedometer2"></i> Production
        </h4>

        <ul class="nav flex-column gap-1">

            <!-- Dashboard -->
            <li class="nav-item">
                <a href="{% url 'dashboard_home' %}"
                   class="nav-link {% if request.resolver_match.url_name == 'dashboard_home' %}active{% endif %}">
                    <i class="bi bi-grid-1x2-fill"></i> Dashboard
                </a>
            </li>

            <!-- Shop (Customer Orders) -->
            <li class="nav-item">
                <a href="{% url 'available_products' %}"
                   class="nav-link {% if request.resolver_match.url_name == 'available_products' %}active{% endif %}">
                    <i class="bi bi-shop"></i> Shop
                </a>
            </li>

            <!-- Products -->
            <li class="nav-item">
                <a href="{% url 'product_list' %}"
                   class="nav-link {% if request.resolver_match.url_name == 'product_list' %}active{% endif %}">
                    <i class="bi bi-box-seam"></i> Products
                </a>
            </li>

            <!-- Reports (Staff only) -->
            {% if user.is_staff %}
            <li class="nav-item">
                <a href="{% url 'reports' %}"
                   class="nav-link {% if request.resolver_match.url_name == 'reports' %}active{% endif %}">
                    <i class="bi bi-bar-chart-line"></i> Reports
                </a>
            </li>
            {% endif %}

        </ul>

        <hr class="text-secondary my-4">

        <!-- USER INFO -->
        <div class="user-box">
            <div class="fw-semibold">{{ user.username }}</div>
            <div class="small text-muted">{{ user.email }}</div>
            <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-light mt-3 w-100">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOPBAR -->
        <div class="topbar d-flex justify-content-between align-items-center">
            <div>
                <strong>{% block page_title %}Dashboard{% endblock %}</strong>
            </div>
            <div class="text-muted small">
                {{ user.username }}
            </div>
        </div>

        <!-- PAGE CONTENT -->
        {% block content %}{% endblock %}

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
