<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ===== ROOT ===== */
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #2c3163, #0b0f2a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
        }

        /* ===== AUTH CARD ===== */
        .auth-card {
            background: linear-gradient(
                145deg,
                rgba(255,255,255,0.10),
                rgba(255,255,255,0.03)
            );
            backdrop-filter: blur(18px);
            padding: 42px;
            border-radius: 22px;
            width: 100%;
            max-width: 420px;
            color: #ffffff;
            box-shadow:
                inset 0 1px 1px rgba(255,255,255,0.08),
                0 25px 55px rgba(0,0,0,0.55);
        }

        /* ===== HEADINGS ===== */
        .auth-card h3 {
            letter-spacing: -0.4px;
        }

        .auth-card .text-muted {
            color: #9ca3af !important;
        }

        /* ===== FORM CONTROLS ===== */
        .auth-card input,
        .auth-card select,
        .auth-card textarea {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            color: #ffffff;
            padding: 12px 14px;
        }

        .auth-card input:focus,
        .auth-card select:focus,
        .auth-card textarea:focus {
            background: rgba(255,255,255,0.12);
            border-color: #6366f1;
            box-shadow: 0 0 0 0.15rem rgba(99,102,241,0.35);
            color: #ffffff;
        }

        /* Django help text */
        .auth-card small {
            color: #9ca3af;
        }

        /* ===== BUTTON ===== */
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border: none;
            border-radius: 999px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            transform: translateY(-1px);
        }

        /* ===== LINKS ===== */
        .auth-card a {
            text-decoration: none;
        }

        .auth-card a.text-info {
            color: #93c5fd !important;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h3 class="fw-bold text-center mb-3">Create Account</h3>
    <p class="text-center text-muted mb-4">Sign up to access the dashboard</p>

    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
        <div class="alert alert-danger">
            {{ form.errors }}
        </div>
        {% endif %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary w-100 mt-3">
            Create Account
        </button>
    </form>

    <p class="text-center mt-4 text-muted">
        Already have an account?
        <a href="{% url 'login' %}" class="text-info">Sign in</a>
    </p>
</div>

</body>
</html>
