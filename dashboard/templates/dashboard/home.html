{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="container-fluid px-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-semibold text-dark">Dashboard</h1>
        <span class="text-muted small">Overview</span>
    </div>

    <!-- Dashboard Cards -->
    <div class="row g-4">

        <div class="col-xl-3 col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="flex-grow-1">
                        <h6 class="text-muted text-uppercase mb-1">Module</h6>
                        <h5 class="mb-0 fw-semibold">Playground</h5>
                    </div>
                    <div class="ms-3 text-primary fs-4">
                        <i class="bi bi-grid"></i>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
